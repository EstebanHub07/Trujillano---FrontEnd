<section class="contenedor cuenta">
  <h1>Mi cuenta</h1>

  @if (sesion(); as s) {
    <div class="cuenta__tarjeta">
      <div class="cuenta__avatar" aria-hidden="true">{{ s.nombreCompleto.charAt(0) }}</div>
      <dl class="cuenta__datos">
        <div>
          <dt>Nombre</dt>
          <dd>{{ s.nombreCompleto }}</dd>
        </div>
        <div>
          <dt>Usuario</dt>
          <dd>{{ s.username }}</dd>
        </div>
      </dl>
      <button type="button" class="boton boton--secundario cuenta__salir" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>

    <div class="cuenta__acciones">
      <a routerLink="/pedidos" class="boton">Mis pedidos</a>
    </div>
  }
</section>
